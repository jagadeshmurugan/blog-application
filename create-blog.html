<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebWriters Blog - Create Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="create">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">WebWriters</a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button>
      <nav id="nav-links" class="nav-links" aria-label="Main navigation"></nav>
    </div>
  </header>

  <main class="form-page">
    <div class="container">
      <div class="form-box wide">
        <h1 id="form-title">Create a blog post</h1>
        <p class="form-intro">Share something useful. You can edit or delete it later from your dashboard.</p>

        <form id="blog-form" novalidate>
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title">
            <p class="error" id="title-error"></p>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Choose a category</option>
              <option value="Technology">Technology</option>
              <option value="Lifestyle">Lifestyle</option>
              <option value="Education">Education</option>
              <option value="Travel">Travel</option>
              <option value="Other">Other</option>
            </select>
            <p class="error" id="category-error"></p>
          </div>
          <div class="form-group">
            <label for="image">Image URL <span class="optional">(optional)</span></label>
            <input type="url" id="image" name="image" placeholder="https://example.com/photo.jpg">
            <p class="error" id="image-error"></p>
          </div>
          <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content"></textarea>
            <p class="error" id="content-error"></p>
          </div>
          <button type="submit" class="btn" id="submit-btn">Publish post</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">WebWriters Blog - a Codomax internship project</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
