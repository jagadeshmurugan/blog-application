<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebWriters Blog - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">WebWriters</a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button>
      <nav id="nav-links" class="nav-links" aria-label="Main navigation"></nav>
    </div>
  </header>

  <main>
    <section class="dashboard">
      <div class="container">
        <div class="dashboard-top">
          <h1 id="welcome-title">Your dashboard</h1>
          <a href="create-blog.html" class="btn">New post</a>
        </div>
        <p class="dashboard-summary" id="post-summary"></p>
        <div class="post-grid" id="my-posts"></div>
      </div>
    </section>
  </main>

  <dialog class="post-dialog" id="post-dialog"></dialog>

  <footer class="site-footer">
    <div class="container">WebWriters Blog - a Codomax internship project</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
